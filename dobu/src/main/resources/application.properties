spring.application.name=dobu

# Banco local de desenvolvimento. Para a entrega em nuvem, substitua por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:h2:mem:dobu}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# H2 Console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator / observabilidade básica
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
info.app.name=Dobu API
info.app.description=API de gestão veterinária

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Usuários de demonstração: altere DEMO_PASSWORD fora do código-fonte.
app.demo.password=${DEMO_PASSWORD:123456}
